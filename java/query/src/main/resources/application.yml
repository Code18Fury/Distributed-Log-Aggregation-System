spring:
  application:
    name: query
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          min-idle: 5

s3:
  endpoint: ${S3_ENDPOINT:localhost:9000}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:logs-bucket}
  access-key: ${S3_ACCESS_KEY_ID:minioadmin}
  secret-key: ${S3_SECRET_ACCESS_KEY:minioadmin}
  use-ssl: ${S3_USE_SSL:false}

# REST API port
server:
  port: ${HTTP_PORT:8080}

# Metrics on a separate management port
management:
  server:
    port: ${METRICS_PORT:8083}
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.logagg: ${LOG_LEVEL:INFO}
