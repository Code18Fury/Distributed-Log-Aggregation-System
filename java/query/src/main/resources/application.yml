spring:
  application:
    name: query
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          min-idle: 5

s3:
  endpoint: ${S3_ENDPOINT:localhost:9000}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:logs-bucket}
  access-key: ${S3_ACCESS_KEY_ID:minioadmin}
  secret-key: ${S3_SECRET_ACCESS_KEY:minioadmin}
  use-ssl: ${S3_USE_SSL:false}

# REST API port
server:
  port: ${HTTP_PORT:8080}

# Metrics on a separate management port
management:
  server:
    port: ${METRICS_PORT:8083}
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.logagg: ${LOG_LEVEL:INFO}

# ── RAG-based Root Cause Analysis Copilot ───────────────────────────────────
rca:
  # Maximum log events passed as context to the LLM. Higher = better accuracy
  # but higher latency and token cost. 200 is a safe default for gpt/gemini models.
  max-context-events: ${RCA_MAX_CONTEXT_EVENTS:200}
  llm:
    # Gemini model to use. gemini-1.5-flash is fast and cost-efficient for RCA.
    model: ${RCA_LLM_MODEL:gemini-1.5-flash}
    # Loaded from environment variable — NEVER hardcode a key here.
    api-key: ${GEMINI_API_KEY}
    # Low temperature keeps the RCA deterministic and factual.
    temperature: 0.2
    # Sufficient tokens for a structured JSON RCA report.
    max-output-tokens: 1024
